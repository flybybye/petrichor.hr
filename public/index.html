<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Petrichor</title>
  <meta name="description" content="Petrichor">
  <meta property="og:title" content="Petrichor">
  <meta property="og:image" content="https://petrichor.hr/og.png">
  <meta property="og:url" content="https://petrichor.hr">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#0d1114">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      display: grid; place-items: center; padding: 16px;
      background: radial-gradient(ellipse 70% 55% at 50% 50%, #161c21 0%, #0d1114 70%) #0d1114;
    }
    h1 { font-size: 0; }
    img {
      display: block; width: min(560px, 78vw); height: auto;
      opacity: 0; transform: translateY(6px);
      animation: in 1.8s cubic-bezier(.2,.7,.2,1) .2s forwards;
    }
    @keyframes in { to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { img { animation: none; opacity: 1; transform: none; } }
  </style>
</head>
<body>
  <h1><img src="/logo.svg" alt="Petrichor" width="1247" height="138"></h1>
</body>
</html>
