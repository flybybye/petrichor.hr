<!doctype html>
<html lang="hr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Petrichor Distillery</title>
  <meta name="description" content="Petrichor Distillery — Strong spirits, crafted in Croatia. Est. 2020.">
  <link rel="icon" type="image/png" href="/logo.png">
  <link rel="apple-touch-icon" href="/logo.png">
  <meta name="theme-color" content="#000000">
  <style>
    * { margin: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; }
    body { background: #000; }
    canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
    main { position: relative; height: 100%; display: grid; place-items: center; }
    .logo {
      width: 150px; height: 150px; border-radius: 50%;
      opacity: 0; filter: blur(12px) grayscale(1);
      transform: scale(.94);
      animation: emerge 2.6s cubic-bezier(.2,.7,.2,1) .4s forwards;
    }
    .halo {
      position: absolute; width: 150px; height: 150px; border-radius: 50%;
      box-shadow: 0 0 80px 20px rgba(255,255,255,.07);
      opacity: 0; animation: breathe 6s ease-in-out 3s infinite;
      pointer-events: none;
    }
    @keyframes emerge { to { opacity: 1; filter: blur(0) grayscale(1); transform: scale(1); } }
    @keyframes breathe { 0%,100% { opacity: 0; } 50% { opacity: 1; } }
    .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
    @media (prefers-reduced-motion: reduce) {
      .logo { animation: none; opacity: 1; filter: grayscale(1); transform: none; }
      .halo { display: none; }
    }
  </style>
</head>
<body>
  <canvas id="rain" aria-hidden="true"></canvas>
  <main>
    <h1 class="sr">Petrichor Distillery — Strong Spirits, Crafted in Croatia, Est. 2020</h1>
    <div class="halo"></div>
    <img class="logo" src="/logo.png" alt="Petrichor Distillery logo">
  </main>
  <script>
  (() => {
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const c = document.getElementById('rain'), x = c.getContext('2d');
    const R = 75;                       // logo radius in CSS px
    let W, H, dpr, drops = [], splashes = [], ripples = [];
    const WIND = -0.12;                 // slight slant

    function size() {
      dpr = Math.min(devicePixelRatio || 1, 2);
      W = innerWidth; H = innerHeight;
      c.width = W * dpr; c.height = H * dpr;
      x.setTransform(dpr, 0, 0, dpr, 0, 0);
      const n = Math.round(W * H / 9000);
      drops = Array.from({ length: n }, () => drop(true));
    }
    function drop(anywhere) {
      const z = Math.random();          // depth: 0 far, 1 near
      return {
        x: Math.random() * (W + 200) - 50,
        y: anywhere ? Math.random() * H : -20 - Math.random() * 100,
        z, v: 6 + z * 10, len: 8 + z * 18, a: .08 + z * .32
      };
    }
    function splash(px, py, z, up) {
      for (let i = 0; i < 2 + (z * 3 | 0); i++) splashes.push({
        x: px, y: py, vx: (Math.random() - .5) * 2.4, vy: -(1 + Math.random() * 2) * up,
        life: 1, a: .25 + z * .4
      });
    }

    function frame() {
      x.clearRect(0, 0, W, H);
      const cx = W / 2, cy = H / 2, ground = H - 8;
      x.lineCap = 'round';

      for (const d of drops) {
        const nx = d.x + d.v * WIND, ny = d.y + d.v;
        // near drops hit the logo badge
        const dx = nx - cx, dy = ny - cy;
        if (d.z > .55 && dx * dx + dy * dy < R * R && ny < cy) {
          splash(nx, ny, d.z, 1);
          Object.assign(d, drop(false));
          continue;
        }
        if (ny > ground - (1 - d.z) * H * .25) {
          if (d.z > .35) ripples.push({ x: nx, y: ny, r: 0, a: d.a * 1.2, max: 6 + d.z * 22 });
          if (d.z > .7) splash(nx, ny, d.z, 1);
          Object.assign(d, drop(false));
          continue;
        }
        x.strokeStyle = `rgba(255,255,255,${d.a})`;
        x.lineWidth = .6 + d.z;
        x.beginPath();
        x.moveTo(nx, ny);
        x.lineTo(nx - d.len * WIND, ny - d.len);
        x.stroke();
        d.x = nx; d.y = ny;
      }

      for (let i = ripples.length - 1; i >= 0; i--) {
        const r = ripples[i];
        r.r += .6; const t = r.r / r.max;
        if (t >= 1) { ripples.splice(i, 1); continue; }
        x.strokeStyle = `rgba(255,255,255,${r.a * (1 - t)})`;
        x.lineWidth = .8;
        x.beginPath();
        x.ellipse(r.x, r.y, r.r, r.r * .22, 0, 0, Math.PI * 2);
        x.stroke();
      }

      for (let i = splashes.length - 1; i >= 0; i--) {
        const s = splashes[i];
        s.x += s.vx; s.y += s.vy; s.vy += .18; s.life -= .04;
        if (s.life <= 0) { splashes.splice(i, 1); continue; }
        x.fillStyle = `rgba(255,255,255,${s.a * s.life})`;
        x.fillRect(s.x, s.y, 1.3, 1.3);
      }
      requestAnimationFrame(frame);
    }
    addEventListener('resize', size);
    size(); frame();
  })();
  </script>
</body>
</html>
